<div flex layout="row">
    <div flex layout="column">
        <table flex class="table table-striped table-responsive table-hover">
            <thead>
                <tr>
                    <th>Question</th>
                    <th>Answer</th>
                    <th>Wrong1</th>
                    <th>Wrong2</th>
                    <th>Wrong3</th>
                    <th>Wrong4</th>
                    <th>Wrong5</th>
                    <th>Wrong6</th.>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.question"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.answer"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong1"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong2"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong3"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong4"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong5"/></td>
                    <td><input class="myInput" type="text" ng-model="beech.newQuestion.wrong6"/></td>
                    <td><button class="btn btn-success" ng-click="beech.update()">Update</button></td>
                    <td><button class="btn btn-warning" ng-click="beech.cancel()">Cancel</button></td>
                </tr>
                <tr ng-repeat="question in beech.questions | orderBy : '_id':true">
                    <td>{{question.question}}</td>
                    <td>{{question.answer}}</td>
                    <td>{{question.wrong1}}</td>
                    <td>{{question.wrong2}}</td>
                    <td>{{question.wrong3}}</td>
                    <td>{{question.wrong4}}</td>
                    <td>{{question.wrong5}}</td>
                    <td>{{question.wrong6}}</td>
                    <td><button class="btn btn-danger" ng-click="beech.delete(question._id)">Delete</button></td>
                    <td><button class="btn btn-default" ng-click="beech.edit(question._id)">Edit</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
